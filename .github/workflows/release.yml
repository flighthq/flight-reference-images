name: Release blessed reference images

on:
  push:
    branches: [main]
    paths:
      # manifest.json is the release boundary: every blessing changes its immutable tag and pack set.
      # Candidate-locator-only maintenance must not try to republish an already immutable release.
      - manifest.json
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: oracle-release
  cancel-in-progress: false

jobs:
  rebuild:
    name: Rebuild release without contents write credentials
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    outputs:
      # Match the algorithm-qualified digest returned by the Actions artifact API.
      artifact-digest: sha256:${{ steps.upload.outputs.artifact-digest }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      manifest-sha256: ${{ steps.bundle.outputs.manifest_sha256 }}
      release-tag: ${{ steps.locator.outputs.release_tag }}
      request-id: ${{ steps.locator.outputs.request_id }}
      request-ids: ${{ steps.locator.outputs.request_ids }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Read candidate locator
        id: locator
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync, readdirSync } from 'node:fs';
          const files = readdirSync('candidates').filter((file) => file.endsWith('.json'));
          if (files.length !== 1) throw new Error(`release requires one candidate locator, found ${files.length}`);
          const locator = JSON.parse(readFileSync(`candidates/${files[0]}`, 'utf8'));
          const requestIds = locator.schemaVersion === 1 ? [locator.requestId] : locator.requestIds;
          appendFileSync(
            process.env.GITHUB_OUTPUT,
            [
              `artifact_id=${locator.preparedArtifact.artifactId}`,
              `artifact_digest=${locator.preparedArtifact.digest}`,
              `run_id=${locator.preparedArtifact.workflowRunId}`,
              `kind=${locator.schemaVersion === 1 ? 'single' : 'batch'}`,
              `request_id=${requestIds[0]}`,
              `request_ids=${requestIds.join(',')}`,
              `release_tag=${locator.releaseTag}`,
            ].join('\n') + '\n',
          );
          NODE
      - name: Verify prepared artifact identity
        env:
          ARTIFACT_ID: ${{ steps.locator.outputs.artifact_id }}
          EXPECTED_DIGEST: ${{ steps.locator.outputs.artifact_digest }}
          EXPECTED_RUN_ID: ${{ steps.locator.outputs.run_id }}
          GH_TOKEN: ${{ github.token }}
          LOCATOR_KIND: ${{ steps.locator.outputs.kind }}
          REQUEST_ID: ${{ steps.locator.outputs.request_id }}
        run: |
          mapfile -t fields < <(
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}" \
              --jq '[.workflow_run.id, .digest, .expired, .name] | .[]'
          )
          expected_name="oracle-batch-${EXPECTED_RUN_ID}"
          if [ "${LOCATOR_KIND}" = 'single' ]; then
            expected_name="oracle-candidate-${REQUEST_ID}-${EXPECTED_RUN_ID}"
          fi
          test "${fields[0]}" = "${EXPECTED_RUN_ID}"
          test "${fields[1]}" = "${EXPECTED_DIGEST}" || {
            echo "::error::prepared artifact digest differs"
            exit 1
          }
          test "${fields[2]}" = 'false'
          test "${fields[3]}" = "${expected_name}"
      - name: Download reviewed candidate
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.locator.outputs.artifact_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.locator.outputs.run_id }}
          path: .artifacts/prepared
          merge-multiple: true
      - name: Download prior complete packs
        run: npm run packs:download -- --manifest .artifacts/prepared/base/manifest.json --output .artifacts/previous-packs
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Replay construction from reviewed candidate bytes
        if: steps.locator.outputs.kind == 'single'
        run: >-
          npm run intake:replay -- --prepared .artifacts/prepared --previous-packs .artifacts/previous-packs --output .artifacts/release


      - name: Replay construction from approved batch
        if: steps.locator.outputs.kind == 'batch'
        run: >-
          npm run batch:replay -- --prepared .artifacts/prepared --previous-packs .artifacts/previous-packs --output .artifacts/release


      - name: Assemble verified release bundle
        id: bundle
        run: |
          mkdir .artifacts/release-bundle
          cp manifest.json .artifacts/release-bundle/manifest.json
          cp .artifacts/release/prospective-packs/*.tgz .artifacts/release-bundle/
          manifest_sha256=$(sha256sum manifest.json | cut -d ' ' -f 1)
          echo "manifest_sha256=${manifest_sha256}" >> "${GITHUB_OUTPUT}"
      - name: Store verified release bundle
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: oracle-release-${{ steps.locator.outputs.release_tag }}-${{ github.run_id }}
          path: .artifacts/release-bundle
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish verified bytes without processing candidate images
    needs: rebuild
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    outputs:
      oracle-commit: ${{ steps.release.outputs.oracle_commit }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify release artifact identity
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.rebuild.outputs.artifact-id }}
          EXPECTED_DIGEST: ${{ needs.rebuild.outputs.artifact-digest }}
        run: |
          actual_digest=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}" --jq .digest)
          test "${actual_digest}" = "${EXPECTED_DIGEST}" || {
            echo "::error::verified release artifact digest differs"
            exit 1
          }
      - name: Download verified release bundle
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.rebuild.outputs.artifact-id }}
          path: .artifacts/release-bundle
          merge-multiple: true
      - name: Verify fixed manifest and pack checksums
        env:
          EXPECTED_MANIFEST_SHA256: ${{ needs.rebuild.outputs.manifest-sha256 }}
        run: |
          actual_manifest_sha256=$(sha256sum .artifacts/release-bundle/manifest.json | cut -d ' ' -f 1)
          test "${actual_manifest_sha256}" = "${EXPECTED_MANIFEST_SHA256}" || {
            echo "::error::release manifest digest differs"
            exit 1
          }
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { readFileSync, readdirSync } from 'node:fs';

          const directory = '.artifacts/release-bundle';
          const manifest = JSON.parse(readFileSync(`${directory}/manifest.json`, 'utf8'));
          const expected = new Set(['manifest.json', ...manifest.packs.map((pack) => pack.file)]);
          const actual = new Set(readdirSync(directory));
          if (expected.size !== actual.size || [...expected].some((file) => !actual.has(file))) {
            throw new Error('release bundle file set differs from manifest');
          }
          for (const pack of manifest.packs) {
            const bytes = readFileSync(`${directory}/${pack.file}`);
            const sha256 = createHash('sha256').update(bytes).digest('hex');
            if (sha256 !== pack.sha256 || bytes.length !== pack.size) throw new Error(`${pack.file} differs from manifest`);
          }
          NODE
      - name: Create or verify immutable release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.rebuild.outputs.release-tag }}
        run: |
          if tag=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" 2>/dev/null); then
            object_type=$(jq -r '.object.type' <<< "${tag}")
            object_sha=$(jq -r '.object.sha' <<< "${tag}")
            while [ "${object_type}" = 'tag' ]; do
              tag=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${object_sha}")
              object_type=$(jq -r '.object.type' <<< "${tag}")
              object_sha=$(jq -r '.object.sha' <<< "${tag}")
            done
            test "${object_type}" = 'commit' || {
              echo "::error::release tag ${RELEASE_TAG} does not resolve to a commit"
              exit 1
            }

            # A later manual run may retry Flight completion after publication succeeded. Never
            # replace release assets: continue only when the existing immutable bytes are exact.
            gh release view "${RELEASE_TAG}" >/dev/null
            mkdir .artifacts/published-release
            gh release download "${RELEASE_TAG}" --dir .artifacts/published-release
            node --input-type=module <<'NODE'
          import { readFileSync, readdirSync } from 'node:fs';

          const expectedDirectory = '.artifacts/release-bundle';
          const actualDirectory = '.artifacts/published-release';
          const expected = readdirSync(expectedDirectory).sort();
          const actual = readdirSync(actualDirectory).sort();
          if (JSON.stringify(actual) !== JSON.stringify(expected)) {
            throw new Error(`existing release asset set differs: ${actual.join(', ')}`);
          }
          for (const file of expected) {
            if (!readFileSync(`${actualDirectory}/${file}`).equals(readFileSync(`${expectedDirectory}/${file}`))) {
              throw new Error(`existing release asset ${file} differs`);
            }
          }
          NODE
            echo "oracle_commit=${object_sha}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          gh release create "${RELEASE_TAG}" \
            --target "${GITHUB_SHA}" \
            --title "${RELEASE_TAG}" \
            --notes "Blessed Flight reference images reconstructed from the reviewed candidate artifact." \
            .artifacts/release-bundle/manifest.json \
            .artifacts/release-bundle/*.tgz
          echo "oracle_commit=${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"

  complete-flight:
    name: Open or advance Flight lock update PR
    needs: [rebuild, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Mint Flight completion token
        id: flight-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.ORACLE_APP_ID }}
          private-key: ${{ secrets.ORACLE_APP_PRIVATE_KEY }}
          owner: flighthq
          repositories: flight
          permission-contents: write
          permission-pull-requests: write
      - name: Find the current Flight lock update PR
        id: completion
        env:
          BASE_BRANCH: ${{ vars.FLIGHT_BASE_BRANCH || 'develop' }}
          GH_TOKEN: ${{ steps.flight-token.outputs.token }}
        run: |
          mkdir -p .artifacts
          gh api \
            "repos/flighthq/flight/pulls?state=open&base=${BASE_BRANCH}&sort=created&direction=asc&per_page=100" \
            > .artifacts/flight-pulls.json
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';

          const pulls = JSON.parse(readFileSync('.artifacts/flight-pulls.json', 'utf8')).filter(
            (pull) =>
              pull.head.repo?.full_name === 'flighthq/flight' && pull.head.ref.startsWith('reference-image-lock/'),
          );
          if (pulls.length > 1) throw new Error(`found ${pulls.length} open Flight lock update PRs; expected at most one`);
          const existing = pulls[0];
          appendFileSync(
            process.env.GITHUB_OUTPUT,
            existing === undefined
              ? `existing=false\n`
              : [
                  'existing=true',
                  `head_ref=${existing.head.ref}`,
                  `head_sha=${existing.head.sha}`,
                  `pull_request=${existing.number}`,
                ].join('\n') + '\n',
          );
          NODE
      - name: Check out Oracle release commit
        uses: actions/checkout@v4
        with:
          path: oracle
          ref: ${{ github.sha }}
      - name: Check out Flight completion base
        uses: actions/checkout@v4
        with:
          repository: flighthq/flight
          ref: ${{ vars.FLIGHT_BASE_BRANCH || 'develop' }}
          path: flight
          token: ${{ steps.flight-token.outputs.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: oracle/package-lock.json
      - run: npm ci
        working-directory: oracle
      - name: Reconcile the immutable lock and fulfilled requests
        working-directory: oracle
        env:
          ORACLE_COMMIT: ${{ needs.publish.outputs.oracle-commit }}
          REQUEST_IDS: ${{ needs.rebuild.outputs.request-ids }}
        run: >-
          npm run flight:reconcile -- --root . --flight-root ../flight --oracle-commit "${ORACLE_COMMIT}" --request-ids "${REQUEST_IDS}"


      - name: Commit and update Flight PR
        working-directory: flight
        env:
          BASE_BRANCH: ${{ vars.FLIGHT_BASE_BRANCH || 'develop' }}
          EXISTING: ${{ steps.completion.outputs.existing }}
          EXPECTED_HEAD_SHA: ${{ steps.completion.outputs.head_sha }}
          GH_TOKEN: ${{ steps.flight-token.outputs.token }}
          HEAD_REF: ${{ steps.completion.outputs.head_ref }}
          PR_NUMBER: ${{ steps.completion.outputs.pull_request }}
          RELEASE_TAG: ${{ needs.rebuild.outputs.release-tag }}
          REQUEST_ID: ${{ needs.rebuild.outputs.request-id }}
          REQUEST_IDS: ${{ needs.rebuild.outputs.request-ids }}
        run: |
          if [ "${EXISTING}" = 'true' ]; then
            branch="${HEAD_REF}"
          else
            branch="reference-image-lock/${REQUEST_ID}-${GITHUB_RUN_ID}"
          fi
          git switch -c "${branch}"
          git config user.name 'flight-reference-images[bot]'
          git config user.email 'flight-reference-images[bot]@users.noreply.github.com'
          git add -A -- scripts/reference-image-lock.json reference-image-requests
          IFS=',' read -ra request_ids <<< "${REQUEST_IDS}"
          git -c core.hooksPath=/dev/null commit -m "chore(reference-images): lock ${RELEASE_TAG}"
          if [ "${EXISTING}" = 'true' ]; then
            git push --force-with-lease="refs/heads/${branch}:${EXPECTED_HEAD_SHA}" origin "HEAD:refs/heads/${branch}"
          else
            git push origin "HEAD:refs/heads/${branch}"
          fi

          body="Pins the immutable blessed release through \`${RELEASE_TAG}\` and fulfills ${#request_ids[@]} newly approved request(s). The branch is reconstructed from current ${BASE_BRANCH}; prior released requests are removed only when their bytes still match the reviewed checksum. Flight CI must prove every cell is locked and gating before merge."
          if [ "${EXISTING}" = 'true' ]; then
            gh pr edit "${PR_NUMBER}" \
              --repo flighthq/flight \
              --title "chore(reference-images): lock ${RELEASE_TAG}" \
              --body "${body}"
          else
            gh pr create \
              --repo flighthq/flight \
              --base "${BASE_BRANCH}" \
              --head "${branch}" \
              --title "chore(reference-images): lock ${RELEASE_TAG}" \
              --body "${body}"
          fi
