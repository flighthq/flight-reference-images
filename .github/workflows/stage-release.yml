name: Stage approved reference image release

on:
  push:
    branches: [main]
    paths: [approvals/*.json]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: oracle-batch-stage
  cancel-in-progress: true

jobs:
  prepare:
    name: Build one release from all approved candidates
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    outputs:
      artifact-digest: sha256:${{ steps.upload.outputs.artifact-digest }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      found: ${{ steps.candidates.outputs.found }}
      release-tag: ${{ steps.identity.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Find approvals absent from the current release
        id: pending
        run: |
          mkdir -p .artifacts
          npm run --silent batch:pending-approvals > .artifacts/pending-plan.json
          jq '.candidates' .artifacts/pending-plan.json > .artifacts/pending.json
          selected=$(jq '.candidates | length' .artifacts/pending-plan.json)
          deferred=$(jq '.deferred | length' .artifacts/pending-plan.json)
          echo "found=$([ "${selected}" -gt 0 ] && echo true || echo false)" >> "${GITHUB_OUTPUT}"
          echo "Found ${selected} current-base approval candidate(s); deferred ${deferred} stale approval(s)." >> "${GITHUB_STEP_SUMMARY}"
          jq -r '.deferred[] | "::warning title=Approval deferred::Request \(.requestId) \(.reason); it remains pending for a fresh review after a compatible release"' \
            .artifacts/pending-plan.json
      - name: Verify and download approved candidates
        id: candidates
        if: steps.pending.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE' > .artifacts/artifacts.tsv
          import { readFileSync } from 'node:fs';
          for (const approval of JSON.parse(readFileSync('.artifacts/pending.json', 'utf8'))) {
            console.log([
              approval.requestId,
              approval.preparedArtifact.artifactId,
              approval.preparedArtifact.digest,
              approval.preparedArtifact.workflowRunId,
            ].join('\t'));
          }
          NODE
          mkdir -p .artifacts/prepared
          : > .artifacts/available-request-ids.txt
          while IFS=$'\t' read -r request_id artifact_id expected_digest expected_run; do
            if ! gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}" > .artifacts/artifact.json; then
              echo "::warning title=Approved artifact deferred::Request ${request_id} artifact ${artifact_id} is unavailable; a later Flight run can replace it"
              continue
            fi
            actual_run=$(jq -r '.workflow_run.id // empty' .artifacts/artifact.json)
            actual_digest=$(jq -r '.digest // empty' .artifacts/artifact.json)
            expired=$(jq -r '.expired | tostring' .artifacts/artifact.json)
            actual_name=$(jq -r '.name // empty' .artifacts/artifact.json)
            expected_name="oracle-candidate-${request_id}-${expected_run}"
            if [ "${actual_run}" != "${expected_run}" ] || [ "${actual_digest}" != "${expected_digest}" ] || \
              [ "${expired}" != 'false' ] || [ "${actual_name}" != "${expected_name}" ]; then
              echo "::warning title=Approved artifact deferred::Request ${request_id} artifact metadata no longer matches its approval; a later Flight run can replace it"
              continue
            fi
            prepared_directory=".artifacts/prepared/${request_id}"
            if ! gh run download "${expected_run}" \
              --repo "${GITHUB_REPOSITORY}" \
              --name "${expected_name}" \
              --dir "${prepared_directory}"; then
              rm -rf -- "${prepared_directory}"
              echo "::warning title=Approved artifact deferred::Request ${request_id} artifact could not be downloaded; a later Flight run can replace it"
              continue
            fi
            if ! npm run --silent intake:verify-approval -- \
              --approval "approvals/${request_id}.json" --prepared "${prepared_directory}"; then
              rm -rf -- "${prepared_directory}"
              echo "::warning title=Approved artifact deferred::Request ${request_id} artifact failed verification; a later Flight run can replace it"
              continue
            fi
            echo "${request_id}" >> .artifacts/available-request-ids.txt
          done < .artifacts/artifacts.tsv
          available=$(wc -l < .artifacts/available-request-ids.txt)
          echo "found=$([ "${available}" -gt 0 ] && echo true || echo false)" >> "${GITHUB_OUTPUT}"
          echo "Verified ${available} downloadable approval artifact(s)." >> "${GITHUB_STEP_SUMMARY}"
      - name: Download current blessed packs
        if: steps.candidates.outputs.found == 'true'
        run: npm run packs:download -- --attempts 60 --retry-delay-ms 10000 --output .artifacts/previous-packs
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Build deterministic batch
        if: steps.candidates.outputs.found == 'true'
        run: >-
          npm run batch:prepare -- --prepared-root .artifacts/prepared --previous-packs .artifacts/previous-packs --output .artifacts/batch


      - name: Read batch identity
        id: identity
        if: steps.candidates.outputs.found == 'true'
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          const batch = JSON.parse(readFileSync('.artifacts/batch/prepared-batch.json', 'utf8'));
          appendFileSync(process.env.GITHUB_OUTPUT, `release_tag=${batch.releaseTag}\n`);
          for (const approval of batch.deferredApprovals ?? [])
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, `- Deferred \`${approval.requestId}\`: ${approval.reason}.\n`);
          NODE
      - name: Store prepared batch
        id: upload
        if: steps.candidates.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: oracle-batch-${{ github.run_id }}
          path: .artifacts/batch
          compression-level: 0
          if-no-files-found: error
          retention-days: 30

  open-pr:
    name: Open or advance one mechanical release PR
    needs: prepare
    if: needs.prepare.outputs.found == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - name: Mint publication token
        id: oracle-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.ORACLE_APP_ID }}
          private-key: ${{ secrets.ORACLE_APP_PRIVATE_KEY }}
          owner: flighthq
          repositories: flight-reference-images
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ steps.oracle-token.outputs.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Download prepared batch
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact-id }}
          path: .artifacts/batch
          merge-multiple: true
      - name: Apply allowlisted batch metadata
        run: >-
          npm run batch:apply -- --prepared .artifacts/batch --artifact-id ${{ needs.prepare.outputs.artifact-id }} --artifact-digest ${{ needs.prepare.outputs.artifact-digest }} --workflow-run-id ${{ github.run_id }}


      - name: Open or replace publication branch
        env:
          GH_TOKEN: ${{ steps.oracle-token.outputs.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release-tag }}
        run: |
          existing=$(gh pr list --base main --state open --limit 100 \
            --json number,headRefName,headRefOid,isCrossRepository \
            --jq '[.[] | select(.isCrossRepository == false and (.headRefName | startswith("publication/")))]')
          count=$(jq length <<< "${existing}")
          test "${count}" -le 1 || { echo '::error::multiple publication PRs are open'; exit 1; }
          if [ "${count}" -eq 1 ]; then
            branch=$(jq -r '.[0].headRefName' <<< "${existing}")
            expected=$(jq -r '.[0].headRefOid' <<< "${existing}")
            pull_request=$(jq -r '.[0].number' <<< "${existing}")
          else
            branch="publication/${GITHUB_RUN_ID}"
          fi
          git switch -c "${branch}"
          git config user.name 'flight-reference-images[bot]'
          git config user.email 'flight-reference-images[bot]@users.noreply.github.com'
          git add manifest.json oracles candidates
          git -c core.hooksPath=/dev/null commit -m "feat(release): stage ${RELEASE_TAG}"
          if [ "${count}" -eq 1 ]; then
            git push --force-with-lease="refs/heads/${branch}:${expected}" origin "HEAD:refs/heads/${branch}"
          else
            git push origin "${branch}"
          fi
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const batch = JSON.parse(readFileSync('.artifacts/batch/prepared-batch.json', 'utf8'));
          const deferred = batch.deferredApprovals ?? [];
          const deferredSection = deferred.length === 0
            ? ''
            : '\n\nDeferred unavailable, overlapping, or stale approvals remain unpublished and may be freshly reviewed after this release:\n\n' +
              deferred.map((approval) => `- \`${approval.requestId}\`: ${approval.reason}`).join('\n');
          writeFileSync(
            '.artifacts/pr-body.md',
            `Publishes ${batch.requestIds.length} approved candidate request(s) as \`${batch.releaseTag}\`.\n\n` +
              batch.requestIds.map((id) => `- \`${id}\``).join('\n') +
              deferredSection +
              '\n\nThis PR is deterministic release materialization; human image approval occurred in the approval PRs.\n',
          );
          NODE
          if [ "${count}" -eq 1 ]; then
            gh pr edit "${pull_request}" --title "feat(release): stage ${RELEASE_TAG}" --body-file .artifacts/pr-body.md
          else
            gh pr create --base main --head "${branch}" --title "feat(release): stage ${RELEASE_TAG}" --body-file .artifacts/pr-body.md
          fi
