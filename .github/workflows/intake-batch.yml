name: Reference image candidate batch intake

on:
  repository_dispatch:
    types: [flight-reference-image-candidate-batch]
  workflow_dispatch:
    inputs:
      payload:
        description: Complete version-2 batch dispatch JSON
        required: true
        type: string

permissions:
  actions: write
  contents: read

concurrency:
  group: reference-image-candidate-batch-intake
  cancel-in-progress: false

jobs:
  validate:
    name: Validate complete dispatch membership
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      candidates: ${{ steps.expand.outputs.candidates }}
      count: ${{ steps.expand.outputs.count }}
      request-ids: ${{ steps.expand.outputs.request_ids }}
      source-run-id: ${{ steps.expand.outputs.source_run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Materialize the fixed batch payload
        env:
          EVENT_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
          MANUAL_PAYLOAD: ${{ inputs.payload }}
        run: |
          mkdir -p .artifacts
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';

          const text = process.env.MANUAL_PAYLOAD || process.env.EVENT_PAYLOAD;
          const payload = JSON.parse(text);
          writeFileSync('.artifacts/dispatch-batch.json', `${JSON.stringify(payload, null, 2)}\n`);
          NODE
          npm run schema:check -- --schema dispatch-batch --file .artifacts/dispatch-batch.json
      - name: Find requests already under review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          : > .artifacts/pending-approval-paths.txt
          pulls=$(gh pr list --base main --state open --limit 1000 \
            --json number,headRefName,isCrossRepository)
          while read -r number; do
            gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/pulls/${number}/files?per_page=100" \
              --jq '.[].filename' \
              >> .artifacts/pending-approval-paths.txt
          done < <(
            jq -r '.[] | select(.isCrossRepository == false and (.headRefName | test("^approval(?:-batch)?/"))) | .number' \
              <<< "${pulls}"
          )
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';

          const requestIds = readFileSync('.artifacts/pending-approval-paths.txt', 'utf8')
            .split('\n')
            .map((path) => /^approvals\/([a-z0-9][a-z0-9-]{0,119})\.json$/u.exec(path)?.[1])
            .filter(Boolean);
          writeFileSync('.artifacts/pending-request-ids.json', `${JSON.stringify([...new Set(requestIds)].sort())}\n`);
          NODE
      - name: Plan retry-safe candidate matrix
        id: expand
        run: |
          plan=$(npm run --silent dispatch:plan -- \
            --file .artifacts/dispatch-batch.json \
            --pending .artifacts/pending-request-ids.json)
          candidates=$(jq -c '.candidates' <<< "${plan}")
          echo "candidates=${candidates}" >> "${GITHUB_OUTPUT}"
          count=$(jq length <<< "${candidates}")
          echo "count=${count}" >> "${GITHUB_OUTPUT}"
          request_ids=$(jq -c \
            '[.candidates[].requestPath | sub("^reference-image-requests/"; "") | sub("\\.json$"; "")]' \
            <<< "${plan}")
          echo "request_ids=${request_ids}" >> "${GITHUB_OUTPUT}"
          source_run_id=$(jq -r '.workflowRunId' .artifacts/dispatch-batch.json)
          echo "source_run_id=${source_run_id}" >> "${GITHUB_OUTPUT}"
          skipped=$(jq '.skipped | length' <<< "${plan}")
          echo "Accepted ${count} new candidate request(s); skipped ${skipped} retry/review duplicate(s)." \
            >> "${GITHUB_STEP_SUMMARY}"
          jq -r '.skipped[] | "::warning title=Candidate already accepted::Request \(.requestId) is \(.reason); ignoring retried artifact bindings"' \
            <<< "${plan}"

  release-ready:
    name: Require the current blessed release before starting candidates
    needs: validate
    if: needs.validate.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Wait once for the complete current release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .artifacts
          workflow_url="https://github.com/${GITHUB_REPOSITORY}/actions/workflows/release.yml"
          if npm run release:readiness -- --attempts 60 --retry-delay-ms 10000 --output .artifacts/release-readiness 2>&1 | tee .artifacts/release-readiness.log; then
            echo "Current blessed release is complete and verified." >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          detail=$(tail -n 1 .artifacts/release-readiness.log)
          echo "::error title=Current blessed release is unavailable::${detail}"
          {
            echo "## Current blessed release is unavailable"
            echo
            echo "${detail}"
            echo
            echo "[Open Release blessed reference images](${workflow_url})"
          } >> "${GITHUB_STEP_SUMMARY}"
          exit 1

  intake:
    name: Intake ${{ matrix.candidate.requestPath }}
    needs: [validate, release-ready]
    if: needs.validate.outputs.count != '0'
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        candidate: ${{ fromJSON(needs.validate.outputs.candidates) }}
    uses: ./.github/workflows/intake.yml
    with:
      repository: ${{ matrix.candidate.repository }}
      flight_commit: ${{ matrix.candidate.flightCommit }}
      request_path: ${{ matrix.candidate.requestPath }}
      request_sha256: ${{ matrix.candidate.requestSha256 }}
      artifact_id: ${{ matrix.candidate.artifactId }}
      workflow_run_id: ${{ matrix.candidate.workflowRunId }}
      artifact_digest: ${{ matrix.candidate.artifactDigest }}
      approval_mode: batch
    secrets:
      ORACLE_APP_ID: ${{ secrets.ORACLE_APP_ID }}
      ORACLE_APP_PRIVATE_KEY: ${{ secrets.ORACLE_APP_PRIVATE_KEY }}

  open-batch-pr:
    name: Write successful allowlisted approvals into one batch PR
    needs: [validate, release-ready, intake]
    if: ${{ always() && needs.validate.result == 'success' && needs.release-ready.result == 'success' && needs.validate.outputs.count != '0' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Mint Oracle PR token
        id: oracle-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.ORACLE_APP_ID }}
          private-key: ${{ secrets.ORACLE_APP_PRIVATE_KEY }}
          owner: flighthq
          repositories: flight-reference-images
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ steps.oracle-token.outputs.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Resolve every complete prepared and review artifact pair
        env:
          EXPECTED_REQUEST_IDS: ${{ needs.validate.outputs.request-ids }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .artifacts
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          writeFileSync('.artifacts/expected-request-ids.json', `${process.env.EXPECTED_REQUEST_IDS}\n`);
          NODE
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
            > .artifacts/artifact-pages.json
          npm run --silent batch:approval-artifacts -- \
            --file .artifacts/artifact-pages.json \
            --workflow-run-id "${GITHUB_RUN_ID}" \
            --expected-request-ids .artifacts/expected-request-ids.json \
            > .artifacts/artifact-resolution.json
          jq -r '.ready[] | [.requestId, .artifactId, .artifactDigest, .reportId] | @tsv' \
            .artifacts/artifact-resolution.json > .artifacts/artifacts.tsv
          jq -r '.skipped[] | "::warning title=Candidate deferred::Request \(.requestId): \(.reason); a later Flight run can retry it"' \
            .artifacts/artifact-resolution.json
          ready=$(jq '.ready | length' .artifacts/artifact-resolution.json)
          skipped=$(jq '.skipped | length' .artifacts/artifact-resolution.json)
          echo "Found ${ready} complete candidate(s); deferred ${skipped}." >> "${GITHUB_STEP_SUMMARY}"
      - name: Download available prepared candidates
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: oracle-candidate-*-${{ github.run_id }}
          path: .artifacts/prepared
          merge-multiple: false
      - name: Refresh the approval base after candidate preparation
        run: git pull --ff-only origin main
      - name: Write every approval record and compact review index
        id: approvals
        env:
          EXPECTED_COUNT: ${{ needs.validate.outputs.count }}
          SOURCE_RUN_ID: ${{ needs.validate.outputs.source-run-id }}
        run: |
          : > .artifacts/approval-paths.txt
          : > .artifacts/accepted-artifacts.tsv
          while IFS=$'\t' read -r request_id artifact_id artifact_digest report_id; do
            approval_path="approvals/${request_id}.json"
            approval_state='absent'
            if git ls-files --error-unmatch "${approval_path}" >/dev/null 2>&1; then
              approval_state=$(npm run --silent approval:status -- --request-id "${request_id}")
            fi
            if [ "${approval_state}" = 'released' ] || [ "${approval_state}" = 'publishable' ]; then
              echo "::warning title=Candidate already accepted::Approval ${request_id} reached main while this batch was running; ignoring the retried artifact bindings"
              continue
            fi
            if [ "${approval_state}" = 'stale' ]; then
              echo "::warning title=Refreshing deferred approval::Approval ${request_id} has an unpublished stale review base; replacing it with this freshly reviewed candidate"
            fi
            prepared=".artifacts/prepared/oracle-candidate-${request_id}-${GITHUB_RUN_ID}"
            if [ ! -f "${prepared}/prepared-intake.json" ]; then
              echo "::warning title=Candidate deferred::Prepared artifact for ${request_id} was unavailable after download; a later Flight run can retry it"
              continue
            fi
            if ! approval_output=$(npm run intake:approve -- \
              --prepared "${prepared}" \
              --artifact-id "${artifact_id}" \
              --artifact-digest "${artifact_digest}" \
              --workflow-run-id "${GITHUB_RUN_ID}" 2>&1); then
              echo "${approval_output}"
              echo "::warning title=Candidate deferred::Prepared approval ${request_id} failed privileged revalidation; a later Flight run can retry it"
              continue
            fi
            echo "${approval_output}"
            printf '%s\t%s\t%s\t%s\n' "${request_id}" "${artifact_id}" "${artifact_digest}" "${report_id}" \
              >> .artifacts/accepted-artifacts.tsv
          done < .artifacts/artifacts.tsv
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const requestIds = readFileSync('.artifacts/accepted-artifacts.tsv', 'utf8')
            .trim().split('\n').filter(Boolean).map((line) => line.split('\t')[0]);
          writeFileSync('.artifacts/candidate-approval-ids.json', `${JSON.stringify(requestIds)}\n`);
          NODE
          npm run --silent batch:select-approvals -- \
            --request-ids .artifacts/candidate-approval-ids.json \
            > .artifacts/approval-selection.json
          jq -r '.deferred[] | "::warning title=Overlapping candidate deferred::Request \(.requestId) \(.reason); a later Flight run can retry it"' \
            .artifacts/approval-selection.json
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const selected = new Set(JSON.parse(readFileSync('.artifacts/approval-selection.json', 'utf8')).selectedRequestIds);
          const lines = readFileSync('.artifacts/accepted-artifacts.tsv', 'utf8')
            .trim().split('\n').filter(Boolean).filter((line) => selected.has(line.split('\t')[0]));
          writeFileSync('.artifacts/accepted-artifacts.tsv', lines.length === 0 ? '' : `${lines.join('\n')}\n`);
          writeFileSync(
            '.artifacts/approval-paths.txt',
            lines.length === 0 ? '' : `${lines.map((line) => `approvals/${line.split('\t')[0]}.json`).join('\n')}\n`,
          );
          NODE
          new_count=$(wc -l < .artifacts/approval-paths.txt)
          echo "new_count=${new_count}" >> "${GITHUB_OUTPUT}"
          echo "Accepted ${new_count} of ${EXPECTED_COUNT} candidate(s) attempted by this batch." >> "${GITHUB_STEP_SUMMARY}"
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';

          const artifacts = readFileSync('.artifacts/accepted-artifacts.tsv', 'utf8')
            .trim()
            .split('\n')
            .filter(Boolean)
            .map((line) => {
              const [requestId, , , reportId] = line.split('\t');
              const url = `https://github.com/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}/artifacts/${reportId}`;
              return { reportUrl: url, requestId };
            });
          const sourceUrl = `https://github.com/flighthq/flight/actions/runs/${process.env.SOURCE_RUN_ID}`;
          const actionRunUrl = `https://github.com/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
          const introduction =
            `## Batch reference image approval\n\n` +
            `This PR blesses ${artifacts.length} validated candidates from [Flight capture run ${process.env.SOURCE_RUN_ID}](${sourceUrl}). Candidates already accepted, already under review, or unable to complete intake were safely deferred.\n\n`;
          const conclusion =
            `\n\nMerging blesses every approval record in this PR. The final immutable release is assigned separately after merge.\n`;
          const directRows = artifacts.map(
            ({ reportUrl, requestId }) => `| \`${requestId}\` | [Open old/new/delta review](${reportUrl}) |`,
          );
          let body =
            introduction + `| Request | Visual review |\n| --- | --- |\n${directRows.join('\n')}` + conclusion;
          if (Buffer.byteLength(body) > 60_000) {
            const compactRows = artifacts.map(({ requestId }) => `| \`${requestId}\` |`);
            body =
              introduction +
              `[Open all old/new/delta review artifacts](${actionRunUrl}); artifact names include their request ids.\n\n` +
              `| Request |\n| --- |\n${compactRows.join('\n')}` +
              conclusion;
          }
          writeFileSync('.artifacts/pr-body.md', body);
          NODE
      - name: Commit and open or update one batch approval PR
        env:
          EXPECTED_COUNT: ${{ needs.validate.outputs.count }}
          GH_TOKEN: ${{ steps.oracle-token.outputs.token }}
          NEW_COUNT: ${{ steps.approvals.outputs.new_count }}
          SOURCE_RUN_ID: ${{ needs.validate.outputs.source-run-id }}
        run: |
          mapfile -t approval_paths < .artifacts/approval-paths.txt
          if [ "${#approval_paths[@]}" -eq 0 ]; then
            echo "::warning title=No new approval PR::None of the ${EXPECTED_COUNT} candidates required a new approval record; retries were accepted without changing main"
            exit 0
          fi

          stable_branch="approval-batch/${SOURCE_RUN_ID}"
          pulls=$(gh pr list --base main --state open --limit 100 \
            --json number,headRefName,headRefOid,isCrossRepository)
          existing=$(jq --arg stable "${stable_branch}" \
            '[.[] | select(.isCrossRepository == false and .headRefName == $stable)]' \
            <<< "${pulls}")
          count=$(jq length <<< "${existing}")
          test "${count}" -le 1 || { echo "::error::multiple approval PRs are open for Flight batch ${SOURCE_RUN_ID}"; exit 1; }
          if [ "${count}" -eq 1 ]; then
            echo "::warning title=Preserving existing batch review::A batch PR for Flight run ${SOURCE_RUN_ID} is already open; placing only newly recovered candidates in a supplemental PR"
            branch="${stable_branch}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            expected=$(git ls-remote --heads origin "refs/heads/${branch}" | cut -f 1)
            count=0
          else
            branch="${stable_branch}"
            expected=$(git ls-remote --heads origin "refs/heads/${branch}" | cut -f 1)
          fi

          git switch -c "${branch}"
          git config user.name 'flight-reference-images[bot]'
          git config user.email 'flight-reference-images[bot]@users.noreply.github.com'
          for approval_path in "${approval_paths[@]}"; do git add "${approval_path}"; done
          git -c core.hooksPath=/dev/null commit -m "feat(approvals): bless Flight batch ${SOURCE_RUN_ID}"
          if [ -n "${expected}" ]; then
            git push --force-with-lease="refs/heads/${branch}:${expected}" origin "HEAD:refs/heads/${branch}"
          else
            git push origin "HEAD:refs/heads/${branch}"
          fi
          title="feat(approvals): bless ${NEW_COUNT}-candidate Flight batch"
          gh pr create --base main --head "${branch}" --title "${title}" --body-file .artifacts/pr-body.md
